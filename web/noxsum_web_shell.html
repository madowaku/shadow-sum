<!doctype html>
<html lang="en">
<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<base href="/">
	$GODOT_HEAD_INCLUDE
	<title>$GODOT_PROJECT_NAME</title>
	<style>
		html, body {
			width: 100%;
			height: 100%;
			height: 100dvh;
			margin: 0;
			overscroll-behavior: none;
			overflow: hidden;
			overflow-x: clip;
			background: #080b13;
		}
		canvas {
			display: block;
			width: 100%;
			max-width: 100vw;
			height: 100%;
			height: 100dvh;
			touch-action: none;
		}

		/* The Grant36 board is portrait-first. For short touch landscapes,
		   offer a readable turn-phone hint instead of shrinking controls. */
		#noxsum-orientation {
			position: fixed;
			inset: 0;
			z-index: 9;
			display: none;
			place-items: center;
			box-sizing: border-box;
			padding: max(20px, env(safe-area-inset-top, 0px)) max(24px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(24px, env(safe-area-inset-left, 0px));
			background: radial-gradient(circle at 50% 30%, #1b2436, #080b13 80%);
			color: #e9e4da;
			text-align: center;
			font-family: system-ui, sans-serif;
			overflow-y: auto;
		}
		#noxsum-orientation .turn-inner { max-width: 410px; }
		#noxsum-orientation .turn-symbol { font-size: 40px; line-height: 1; color: #dfc08d; }
		#noxsum-orientation .turn-title { margin-top: 12px; font-size: 18px; font-weight: 600; letter-spacing: 0.04em; }
		#noxsum-orientation .turn-caption { margin-top: 8px; font-size: 13px; line-height: 1.6; color: #cbd6dd; }
		@media (orientation: landscape) and (pointer: coarse) and (max-height: 540px) {
			#noxsum-orientation { display: grid; }
		}
		#noxsum-loading {
			position: fixed;
			inset: 0;
			z-index: 10;
			display: grid;
			place-items: center;
			padding: 24px;
			box-sizing: border-box;
			background: #080b13;
			color: #e5e7ed;
			font-family: system-ui, sans-serif;
			text-align: center;
			opacity: 1;
			transition: opacity 240ms ease;
		}
		#noxsum-loading.ready { opacity: 0; pointer-events: none; }
		#noxsum-loading .loading-inner { width: min(340px, 100%); }
		#noxsum-loading .loading-title { font-size: 26px; letter-spacing: 0.3em; font-weight: 500; padding-left: 0.3em; }
		#noxsum-loading .loading-caption { margin-top: 18px; font-size: 12px; line-height: 1.9; color: #a8afc2; }
		#noxsum-loading .loading-slides { margin-top: 26px; min-height: 132px; padding: 18px 18px 14px; border: 1px solid rgba(193, 168, 120, 0.28); border-radius: 10px; background: rgba(16, 26, 37, 0.72); text-align: left; cursor: pointer; -webkit-tap-highlight-color: transparent; }
		#noxsum-loading .slide-step { font-size: 11px; letter-spacing: 0.16em; color: #c1a878; }
		#noxsum-loading .slide-title { margin-top: 8px; font-size: 17px; font-weight: 600; line-height: 1.45; color: #ece6da; }
		#noxsum-loading .slide-body { margin-top: 8px; font-size: 14px; line-height: 1.75; color: #c3cad8; }
		#noxsum-loading .slide-text { transition: opacity 260ms ease; }
		#noxsum-loading .slide-text.fading { opacity: 0; }
		#noxsum-loading .slide-dots { display: flex; justify-content: center; gap: 8px; margin-top: 12px; }
		#noxsum-loading .slide-dots span { width: 6px; height: 6px; border-radius: 50%; background: #3a4254; transition: background 200ms ease; }
		#noxsum-loading .slide-dots span.on { background: #c1a878; }
		#noxsum-loading .loading-track { margin-top: 22px; height: 3px; overflow: hidden; background: #343b4c; border-radius: 10px; }
		#noxsum-loading .loading-fill { height: 100%; width: 0; background: #c1c9dc; transition: width 120ms linear; }
		#noxsum-loading .loading-percent { margin-top: 12px; min-height: 18px; color: #a8afc2; font-size: 12px; font-variant-numeric: tabular-nums; }
		#noxsum-loading.indeterminate .loading-fill { width: 35% !important; animation: noxsum-wait 1.3s ease-in-out infinite alternate; }
		@keyframes noxsum-wait { from { transform: translateX(0); } to { transform: translateX(180%); } }
		@media (prefers-reduced-motion: reduce) {
			#noxsum-loading, #noxsum-loading .loading-fill, #noxsum-loading .slide-text { transition: none; }
			#noxsum-loading.indeterminate .loading-fill { animation: none; }
		}
	</style>
</head>
<body>
	<canvas id="canvas"></canvas>
	<div id="noxsum-orientation" role="note" aria-label="Portrait orientation recommended">
		<div class="turn-inner">
			<div class="turn-symbol" aria-hidden="true">↻</div>
			<div class="turn-title">縦向きで、夜の記録を。</div>
			<div class="turn-caption">スマホを縦向きにすると、影をじっくり観察できます。<br>Rotate your phone to portrait to play NOXSUM.</div>
		</div>
	</div>
	<div id="noxsum-loading" role="status" aria-live="polite">
		<div class="loading-inner">
			<div class="loading-title">NOXSUM</div>
			<div class="loading-caption">夜の記録を読み込んでいます<br>Loading the archive</div>
			<div class="loading-slides" aria-live="off" title="Tap for the next tip">
				<div class="slide-text">
					<div class="slide-step"></div>
					<div class="slide-title"></div>
					<div class="slide-body"></div>
				</div>
				<div class="slide-dots" aria-hidden="true"></div>
			</div>
			<div class="loading-track" role="progressbar" aria-label="Game download progress" aria-valuemin="0" aria-valuemax="100"><div class="loading-fill"></div></div>
			<div class="loading-percent">Preparing…</div>
		</div>
	</div>
	<script src="$GODOT_URL"></script>
	<script>
		const noxsumLocale = null;
		const loading = document.getElementById("noxsum-loading");
		const progressTrack = loading.querySelector(".loading-track");
		const progressFill = loading.querySelector(".loading-fill");
		const progressText = loading.querySelector(".loading-percent");
		const onProgress = (current, total) => {
			// Compressed or chunked transfers may not report a usable total.
			if (total > 0) {
				const percent = Math.max(0, Math.min(100, Math.round(current * 100 / total)));
				loading.classList.remove("indeterminate");
				progressFill.style.width = percent + "%";
				progressText.textContent = percent + "%";
				progressTrack.setAttribute("aria-valuenow", String(percent));
			} else {
				loading.classList.add("indeterminate");
				progressTrack.removeAttribute("aria-valuenow");
				progressText.textContent = "Loading…";
			}
		};
		const engine = new Engine($GODOT_CONFIG);
		const gameStarted = engine.startGame({
			...(noxsumLocale ? { locale: noxsumLocale } : {}),
			onProgress
		});

		const reportViewport = (reason) => {
			const visualViewport = window.visualViewport;
			const canvas = document.getElementById("canvas");
			const canvasRect = canvas.getBoundingClientRect();
			const cssWidth = Math.min(window.innerWidth, visualViewport ? visualViewport.width : window.innerWidth);
			console.info("[NOXSUM CSS viewport] " + JSON.stringify({
				event: reason,
				innerWidth: window.innerWidth,
				innerHeight: window.innerHeight,
				devicePixelRatio: window.devicePixelRatio,
				visualViewportWidth: visualViewport ? visualViewport.width : null,
				visualViewportHeight: visualViewport ? visualViewport.height : null,
				mobileWidth: cssWidth,
				canvasRectWidth: canvasRect.width,
				canvasRectHeight: canvasRect.height,
				canvasWidth: canvas.width,
				canvasHeight: canvas.height,
				canvasStyleWidth: canvas.style.width,
				canvasStyleHeight: canvas.style.height
			}));
		};
		window.addEventListener("resize", () => reportViewport("resize"), { passive: true });
		window.addEventListener("orientationchange", () => reportViewport("orientationchange"), { passive: true });
		if (window.visualViewport) {
			window.visualViewport.addEventListener("resize", () => reportViewport("visualViewport.resize"), { passive: true });
		}
		gameStarted.then(() => {
			loading.classList.add("ready");
			window.setTimeout(() => loading.remove(), 260);
			document.title = "NOXSUM";
			reportViewport("engine.started");
			if (window.ResizeObserver) {
				new ResizeObserver(() => reportViewport("canvas.resize")).observe(document.getElementById("canvas"));
			}
		}).catch((error) => {
			console.error("[NOXSUM] Unable to start game", error);
			loading.classList.remove("indeterminate");
			progressFill.style.width = "0";
			progressText.textContent = "読み込みに失敗しました / Load failed. Please reload.";
			progressTrack.removeAttribute("aria-valuenow");
		});
	</script>
	<script>
		// Rule primer shown while the engine downloads. Copy is condensed from
		// the in-game HOW TO PLAY page (src/nox_home.gd, src/nox_locale.gd).
		(() => {
			const box = document.querySelector("#noxsum-loading .loading-slides");
			if (!box) return;
			const japanese = /^ja\b/i.test(navigator.language || "");
			const slides = japanese ? [
				["影から、消えたNOXを探す", "記録板に残った影は、NOXがいた場所を覚えている。影に合う場所へ、NOXの痕跡を置いていこう。"],
				["影の濃さを読む", "影が重なるマスほど濃くなる。「？」は記録されていない場所。"],
				["姿勢と光を見る", "座る（SIT）影は近くに、立つ（STAND）影は遠くまで届く。光の向きでも影は変わる。"],
				["すべての影を一致させる", "制限時間もペナルティもない。「観察」を使えば、答えを置かずに手がかりを読める。"]
			] : [
				["Find NOX from the shadows", "The recorded shadows remember where NOX was. Place NOX's traces where those shadows agree."],
				["Read the darkness", "Darker squares hold more overlapping shadows. A question mark is an unrecorded area."],
				["Watch the pose and the light", "SIT leaves a nearby shadow. STAND reaches farther. The direction of the light changes every shadow."],
				["Let every shadow agree", "There is no timer or penalty. OBSERVE offers a clue without placing an answer."]
			];
			const label = japanese ? "遊び方" : "HOW TO PLAY";
			const text = box.querySelector(".slide-text");
			const step = box.querySelector(".slide-step");
			const title = box.querySelector(".slide-title");
			const body = box.querySelector(".slide-body");
			const dots = box.querySelector(".slide-dots");
			const reduced = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;
			slides.forEach(() => dots.appendChild(document.createElement("span")));
			let index = 0;
			let timer = 0;
			const render = () => {
				const [heading, copy] = slides[index];
				step.textContent = label + "  " + (index + 1) + " / " + slides.length;
				title.textContent = heading;
				body.textContent = copy;
				Array.from(dots.children).forEach((dot, i) => dot.classList.toggle("on", i === index));
			};
			const advance = () => {
				index = (index + 1) % slides.length;
				if (reduced) { render(); return; }
				text.classList.add("fading");
				window.setTimeout(() => { render(); text.classList.remove("fading"); }, 260);
			};
			const schedule = () => {
				window.clearInterval(timer);
				timer = window.setInterval(() => {
					if (!document.body.contains(box)) { window.clearInterval(timer); return; }
					advance();
				}, 6000);
			};
			box.addEventListener("click", () => { advance(); schedule(); });
			render();
			schedule();
		})();
	</script>
</body>
</html>
