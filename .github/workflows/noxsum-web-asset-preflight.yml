name: NOXSUM Web asset preflight

on:
  push:
    paths:
      - "export_presets.cfg"
      - "tools/audit_noxsum_web_payload.py"
      - ".github/workflows/noxsum-web-asset-preflight.yml"
  pull_request:
    paths:
      - "export_presets.cfg"
      - "tools/audit_noxsum_web_payload.py"
      - ".github/workflows/noxsum-web-asset-preflight.yml"

jobs:
  check-unused-web-assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Audit NOXSUM Web exclusions
        run: python3 tools/audit_noxsum_web_payload.py
