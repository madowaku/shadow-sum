name: Godot 4.7 Smoke Test

on:
  push:
    paths:
      - "project.godot"
      - "scenes/**"
      - "src/**"
      - "data/**"
      - "tools/feel_smoke.gd"
      - "tools/layout_smoke.gd"
      - "tools/interaction_smoke.gd"
      - "tools/magnetic_smoke.gd"
      - "tools/flow_smoke.gd"
      - "tools/progress_smoke.gd"
      - ".github/workflows/godot-smoke.yml"
  pull_request:
    paths:
      - "project.godot"
      - "scenes/**"
      - "src/**"
      - "data/**"
      - "tools/feel_smoke.gd"
      - "tools/layout_smoke.gd"
      - "tools/interaction_smoke.gd"
      - "tools/magnetic_smoke.gd"
      - "tools/flow_smoke.gd"
      - "tools/progress_smoke.gd"
      - ".github/workflows/godot-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Godot 4.7
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          csharp: false
          export-templates: false

      - name: Verify Godot
        run: godot --version

      - name: Import project
        run: godot --headless --path . --editor --quit

      - name: Boot main scene
        run: SHADOW_SUM_PROGRESS_PATH=user://boot_smoke_progress.json godot --headless --path . --quit-after 2

      - name: Exercise feel interactions
        run: SHADOW_SUM_PROGRESS_PATH=user://feel_smoke_progress.json godot --headless --path . --script res://tools/feel_smoke.gd

      - name: Exercise PICK SLIDE CLICK interaction
        run: SHADOW_SUM_PROGRESS_PATH=user://interaction_smoke_progress.json godot --headless --path . --script res://tools/interaction_smoke.gd

      - name: Exercise magnetic snap tuning
        run: SHADOW_SUM_PROGRESS_PATH=user://magnetic_smoke_progress.json godot --headless --path . --script res://tools/magnetic_smoke.gd

      - name: Exercise one more puzzle flow
        run: SHADOW_SUM_PROGRESS_PATH=user://flow_smoke_progress.json godot --headless --path . --script res://tools/flow_smoke.gd

      - name: Exercise KEEP THE LIGHT progress
        run: godot --headless --path . --script res://tools/progress_smoke.gd

      - name: Verify 360x800 layout
        run: SHADOW_SUM_PROGRESS_PATH=user://layout_smoke_progress.json godot --headless --path . --script res://tools/layout_smoke.gd
