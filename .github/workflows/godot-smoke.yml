name: Godot 4.7 Smoke Test

on:
  push:
    paths:
      - "project.godot"
      - "scenes/**"
      - "src/**"
      - "data/**"
      - "tools/feel_smoke.gd"
      - "tools/layout_smoke.gd"
      - "tools/interaction_smoke.gd"
      - "tools/magnetic_smoke.gd"
      - "tools/flow_smoke.gd"
      - "tools/progress_smoke.gd"
      - "tools/hint_smoke.gd"
      - "tools/night_skin_smoke.gd"
      - "tools/glass_metal_smoke.gd"
      - "tools/godot_checked.sh"
      - ".github/workflows/godot-smoke.yml"
  pull_request:
    paths:
      - "project.godot"
      - "scenes/**"
      - "src/**"
      - "data/**"
      - "tools/feel_smoke.gd"
      - "tools/layout_smoke.gd"
      - "tools/interaction_smoke.gd"
      - "tools/magnetic_smoke.gd"
      - "tools/flow_smoke.gd"
      - "tools/progress_smoke.gd"
      - "tools/hint_smoke.gd"
      - "tools/night_skin_smoke.gd"
      - "tools/glass_metal_smoke.gd"
      - "tools/godot_checked.sh"
      - ".github/workflows/godot-smoke.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Godot 4.7
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          csharp: false
          export-templates: false
      - name: Verify Godot
        run: bash tools/godot_checked.sh --version
      - name: Import project
        run: bash tools/godot_checked.sh --headless --path . --editor --quit
      - name: Boot main scene
        run: SHADOW_SUM_PROGRESS_PATH=user://boot_smoke_progress.json bash tools/godot_checked.sh --headless --path . --quit-after 2
      - name: Exercise feel interactions
        run: SHADOW_SUM_PROGRESS_PATH=user://feel_smoke_progress.json bash tools/godot_checked.sh --headless --path . --script res://tools/feel_smoke.gd
      - name: Exercise PICK SLIDE CLICK interaction
        run: SHADOW_SUM_PROGRESS_PATH=user://interaction_smoke_progress.json bash tools/godot_checked.sh --headless --path . --script res://tools/interaction_smoke.gd
      - name: Exercise magnetic snap tuning
        run: SHADOW_SUM_PROGRESS_PATH=user://magnetic_smoke_progress.json bash tools/godot_checked.sh --headless --path . --script res://tools/magnetic_smoke.gd
      - name: Exercise one more puzzle flow
        run: SHADOW_SUM_PROGRESS_PATH=user://flow_smoke_progress.json bash tools/godot_checked.sh --headless --path . --script res://tools/flow_smoke.gd
      - name: Exercise KEEP THE LIGHT progress
        run: bash tools/godot_checked.sh --headless --path . --script res://tools/progress_smoke.gd
      - name: Exercise WHISPER HINTS
        run: SHADOW_SUM_PROGRESS_PATH=user://hint_smoke_progress.json bash tools/godot_checked.sh --headless --path . --script res://tools/hint_smoke.gd
      - name: Exercise MONOCHROME NIGHT skin
        run: SHADOW_SUM_PROGRESS_PATH=user://night_skin_smoke_progress.json bash tools/godot_checked.sh --headless --path . --script res://tools/night_skin_smoke.gd
      - name: GLASS & METAL main script
        run: SHADOW_SUM_PROGRESS_PATH=user://glass_script_progress.json SHADOW_SUM_GLASS_PHASE=script bash tools/godot_checked.sh --headless --path . --script res://tools/glass_metal_smoke.gd
      - name: GLASS & METAL visual arrays
        run: SHADOW_SUM_PROGRESS_PATH=user://glass_arrays_progress.json SHADOW_SUM_GLASS_PHASE=arrays bash tools/godot_checked.sh --headless --path . --script res://tools/glass_metal_smoke.gd
      - name: GLASS & METAL material children
        run: SHADOW_SUM_PROGRESS_PATH=user://glass_children_progress.json SHADOW_SUM_GLASS_PHASE=children bash tools/godot_checked.sh --headless --path . --script res://tools/glass_metal_smoke.gd
      - name: GLASS & METAL Stage001 solve
        run: SHADOW_SUM_PROGRESS_PATH=user://glass_solve_progress.json SHADOW_SUM_GLASS_PHASE=solve bash tools/godot_checked.sh --headless --path . --script res://tools/glass_metal_smoke.gd
      - name: GLASS & METAL hidden glass
        run: SHADOW_SUM_PROGRESS_PATH=user://glass_hidden_progress.json SHADOW_SUM_GLASS_PHASE=hidden bash tools/godot_checked.sh --headless --path . --script res://tools/glass_metal_smoke.gd
      - name: GLASS & METAL drag isolation
        run: SHADOW_SUM_PROGRESS_PATH=user://glass_drag_progress.json SHADOW_SUM_GLASS_PHASE=drag bash tools/godot_checked.sh --headless --path . --script res://tools/glass_metal_smoke.gd
      - name: Verify 405x900, 676x900 and 720x900 layouts
        run: SHADOW_SUM_PROGRESS_PATH=user://layout_smoke_progress.json bash tools/godot_checked.sh --headless --path . --script res://tools/layout_smoke.gd
