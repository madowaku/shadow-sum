name: NOXSUM Grant36 release regression

on:
  pull_request:
    paths:
      - "export_presets.cfg"
      - "web/**"
      - "src/**"
      - "data/noxsum_grant36_v1.json"
      - "tools/nox_*smoke.gd"
      - ".github/workflows/noxsum-release-regression.yml"
  workflow_dispatch:

jobs:
  godot-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Setup Godot 4.7
        uses: solarlabyrinth/action-setup-godot@v3
        with:
          version: 4.7-stable
          csharp: false
          export-templates: false
      - name: Import resources and validate scripts
        run: bash tools/godot_checked.sh --headless --path . --editor --quit
      - name: Verify curated Grant36 puzzle presentation and solving
        run: bash tools/godot_checked.sh --headless --path . --script res://tools/nox_presentation_smoke.gd
      - name: Verify JP/EN localization and persistence
        run: bash tools/godot_checked.sh --headless --path . --script res://tools/nox_locale_smoke.gd
      - name: Verify mobile 360/405/720 layouts, GR01/28/29/36
        run: bash tools/godot_checked.sh --headless --path . --script res://tools/nox_mobile_ui_smoke.gd
      - name: Verify first-run opening, skip, replay, mobile gestures
        run: bash tools/godot_checked.sh --headless --path . --script res://tools/nox_opening_kamishibai_smoke.gd
      - name: Verify all four BGM tracks and sound toggle
        run: bash tools/godot_checked.sh --headless --path . --script res://tools/nox_audio_smoke.gd
      - name: Verify NOX afterimage effects and input
        run: bash tools/godot_checked.sh --headless --path . --script res://tools/nox_afterimage_smoke.gd
